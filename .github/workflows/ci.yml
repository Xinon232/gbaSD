name: Build check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: apt-get update && apt-get install -y python3
      - name: Compile in both configurations
        env:
          DEVKITARM: /opt/devkitpro/devkitARM
        run: sh tests/build_check.sh
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SuperCard driver host tests (default and gbamp3 configuration)
        run: sh tests/host/run.sh
  fatfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exfatprogs, dosfstools, mtools
        run: sudo apt-get update && sudo apt-get install -y exfatprogs dosfstools mtools
      - name: FatFs tests (exfat_repair, folder-growth power cuts, exFAT kit; both switch configurations)
        run: sh tests/fatfs/run.sh
